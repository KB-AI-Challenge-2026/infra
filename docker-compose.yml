services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kb-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kbai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kbai"]
      interval: 5s
      timeout: 5s
      retries: 10

  aiserver:
    build:
      context: ../aiserver
    environment:
      DATABASE_URL: postgresql://kb_ai_user:kb_ai_password@postgres:5432/kbai
      AI_MODEL_PROVIDER: ${AI_MODEL_PROVIDER:-rules}
      UPSTAGE_API_KEY: ${UPSTAGE_API_KEY:-}
      UPSTAGE_MODEL: ${UPSTAGE_MODEL:-solar-pro3}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          ".venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  aiserver-sync:
    build:
      context: ../aiserver
    restart: unless-stopped
    command: [".venv/bin/python", "-m", "knowledge.scheduler"]
    environment:
      DATABASE_URL: postgresql://kb_ai_user:kb_ai_password@postgres:5432/kbai
      EXTERNAL_SYNC_INTERVAL_SECONDS: ${EXTERNAL_SYNC_INTERVAL_SECONDS:-43200}
      LAW_OPEN_API_OC: ${LAW_OPEN_API_OC:-}
      FSS_FINLIFE_AUTH_KEY: ${FSS_FINLIFE_AUTH_KEY:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      aiserver:
        condition: service_healthy

  backend:
    build:
      context: ../backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/kbai
      AI_BASE_URL: http://aiserver:8000
      DOCUMENT_STORAGE_DIR: /var/lib/kb-ai/documents
    ports:
      - "8080:8080"
    volumes:
      - document_data:/var/lib/kb-ai/documents
    depends_on:
      postgres:
        condition: service_healthy
      aiserver:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4318:4318"

volumes:
  postgres_data:
  document_data:
